name: Feature request
description: Something the port does not do yet, or a change to how it works.
labels: [enhancement]
body:
  - type: checkboxes
    id: duplicates
    attributes:
      label: Existing issues
      options:
        - label: I read the [README](https://github.com/vfjoo888/SuperWonders#readme) and [searched open and closed issues](https://github.com/vfjoo888/SuperWonders/issues?q=is%3Aissue) for this request.
          required: true
  - type: textarea
    id: request
    attributes:
      label: What you want and why
    validations:
      required: true
  - type: dropdown
    id: help
    attributes:
      label: Would you work on it?
      options:
        - "Yes, I would like to send a pull request"
        - "I can help test it"
        - "No"
